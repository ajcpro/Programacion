<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title></title>
    <link rel="stylesheet" href="estilos/estilo.css">
  </head>
<body>
  <h1 id="programacion">Programacion</h1>
  <p>Apuntes para el módulo Programación de DAM/DAW</p>
  <ul>
  <li><a href="temas/tema_01.html">Tema 01</a></li>
  </ul>

  <!-- Script para abrir enlaces externos en una nueva pestaña -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {
      var links = document.querySelectorAll('a');
      links.forEach(function(link) {
          if (link.hostname && link.hostname !== location.hostname) {
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
          }
      });
  });
  document.querySelectorAll('.tooltip').forEach(el => {
    const tooltip = el.querySelector('.tooltiptext');
    if (!tooltip) return;

    el.addEventListener('mouseenter', adjustTooltip);
    el.addEventListener('focusin', adjustTooltip);

    function adjustTooltip() {
      // 1. Resetea clases previas para medir la posición limpia por defecto (Arriba / Izquierda)
      tooltip.classList.remove('tooltip-bottom', 'overflow-right');

      // 2. Mide la posición en pantalla
      let rect = tooltip.getBoundingClientRect();

      // Si choca con el techo de la pantalla (menos de 10px del borde superior), lo pasa ABAJO
      if (rect.top < 10) {
        tooltip.classList.add('tooltip-bottom');
        rect = tooltip.getBoundingClientRect(); // Vuelve a medir tras el cambio
      }

      // Si choca con el borde derecho de la pantalla, ajusta la alineación a la derecha
      if (rect.right > window.innerWidth - 15) {
        tooltip.classList.add('overflow-right');
      }
    }
  });
  </script>
</body>
</html>
